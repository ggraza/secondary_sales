[project]
name = "secondary_sales"
authors = [{ name = "Ghulam Ghous" }]
description = "Offline-first PWA for field order taking (secondary sales) on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "W191", "E101", "B017"]

[tool.ruff.format]
indent-style = "tab"
