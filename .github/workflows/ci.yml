name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-browser:
    name: Unit, security and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python unit tests (no Frappe needed)
        run: python -m unittest discover -s secondary_sales/tests/unit -t . -v
      - name: JavaScript unit tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Browser tests (offline, sync, XSS, CSP, responsive)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests_e2e/run.mjs

  server:
    name: ERPNext integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true
      - name: Install MariaDB client and wkhtmltopdf deps
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Install bench
        run: pip install frappe-bench
      - name: Init bench
        run: bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
      - name: Get ERPNext and this app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --skip-assets secondary_sales $GITHUB_WORKSPACE
      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app secondary_sales
          bench --site test_site set-config allow_tests true
      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app secondary_sales
